<div class="fg"><h3>Наявність</h3><label class="chk"><input type="checkbox" id="stock" ${S.stock?'checked':''}>Тільки в наявності</label><label class="chk"><input type="checkbox" id="sale" ${S.sale?'checked':''}>Тільки акційні</label></div>
<button class="btn sec sm block" id="reset">Скинути фільтри</button></aside>
<div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:`<div class="empty"><div class="big">:(</div><h2 style="margin:10px 0 0">Нічого не знайдено</h2><p>Спробуйте змінити фільтри або пошуковий запит.</p><button class="btn" id="reset2">Скинути фільтри</button></div>`}</div></div>`;
$('#sort').value=S.sort;updateBadges();window.scrollTo({top:0})}
V.addEventListener('change',e=>{const t=e.target;if(t.name==='cat')S.cat=t.value;else if(t.dataset.brand){S.brand=t.checked?[...S.brand,t.dataset.brand]:S.brand.filter(b=>b!==t.dataset.brand)}else if(t.id==='stock')S.stock=t.checked;else if(t.id==='sale')S.sale=t.checked;else if(t.id==='sort')S.sort=t.value;else if(t.id==='pmin')S.min=t.value;else if(t.id==='pmax')S.max=t.value;else return;filtersOpen=!!$('.filters.open');refresh()});
function refresh(){const y=scrollY;showList();scrollTo({top:y})}
function reset(){Object.assign(S,{cat:'',brand:[],q:'',sale:false,min:'',max:'',stock:false});history.replaceState(null,'','catalog.html');refresh()}
V.addEventListener('click',e=>{const t=e.target;if(t.id==='reset'||t.id==='reset2')return reset();if(t.id==='fb'){$('.filters').classList.toggle('open');filtersOpen=!filtersOpen;return}
const rm=t.closest('[data-rm]');if(rm){const k=rm.dataset.rm;if(k==='cat')S.cat='';else if(k==='sale')S.sale=false;else if(k==='price'){S.min='';S.max=''}else if(k==='stock')S.stock=false;else S.brand=S.brand.filter(b=>b!==k.slice(6));refresh()}});
/* картка товару */
function showDetail(id){const p=byId(id);if(!p||p.visible===false){renderHeader('');V.innerHTML=`<div class="empty"><div class="big">404</div><h1 style="margin:10px 0 8px">Товар не знайдено</h1><p>Можливо, товар більше не продається або адресу введено з помилкою.</p><a class="btn" href="catalog.html">До каталогу</a></div>`;return}
renderHeader(p.cat);document.title=p.name+' · DeepBlue Dive';const [ol,ov,off]=OPTS[p.cat];if(detail.id!==p.id){detail={id:p.id,opt:ov.find(v=>!off.includes(v)),qty:1,tab:'spec',img:0}}
const rel=shopProducts().filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);
V.innerHTML=`<div class="crumbs"><a href="index.html">Головна</a> › <a href="catalog.html">Каталог</a> › <a href="catalog.html?cat=${p.cat}">${CATS[p.cat]}</a> › ${esc(p.name.slice(0,40))}</div>
<div class="prod"><div><div class="big">${ICONS[p.icon]}</div><div class="thumbs">${[0,1,2,3].map(i=>`<button class="${i===detail.img?'on':''}" data-img="${i}" aria-label="Фото ${i+1}">${ICONS[p.icon]}</button>`).join('')}</div></div>
<div><div class="brand">${esc(p.brand)} · Арт. ${esc(p.sku)}</div><h1 style="margin-top:4px">${esc(p.name)}</h1><div class="stars" style="margin:8px 0">${stars(p.rating)}<small>${p.rating} · ${p.reviews} відгуків</small></div>
<div class="avail" style="color:${p.stock>5?'var(--ok)':p.stock>0?'#a85410':'var(--err)'}">${p.stock>5?'В наявності · відправимо сьогодні':p.stock>0?'Залишилось '+p.stock+' шт.':'Немає в наявності'}</div>
<div class="pr">${fmt(p.price)}${p.old?`<s>${fmt(p.old)}</s>`:''}</div>
<div class="lab">${ol}</div><div class="sizes">${ov.map(v=>`<button class="sz ${v===detail.opt?'on':''}" data-opt="${esc(v)}" ${off.includes(v)?'disabled':''}>${esc(v)}</button>`).join('')}</div>
<div class="buy"><div class="qty"><button data-q="-1" aria-label="Менше">−</button><span>${detail.qty}</span><button data-q="1" aria-label="Більше">+</button></div><button class="btn" id="buy" ${p.stock?'':'disabled'}>Купити зараз</button><button class="btn sec" id="addc" ${p.stock?'':'disabled'}>У кошик</button><button class="fav heart ${getFavs().includes(p.id)?'on':''}" data-fav="${p.id}" style="position:static;box-shadow:none" aria-label="В обране"><svg viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-3 4.5 4.5 0 018 3c0 6-8 11-8 11z"/></svg></button></div>
<div class="perks"><p>🚚 <b>Доставка</b> Новою поштою завтра, безкоштовно від 3 000 ₴</p><p>🛡 <b>Гарантія</b> ${esc(p.specs.find(s=>s[0]==='Гарантія')?.[1]||'12 місяців')} від офіційного дистриб'ютора</p><p>↩ <b>Повернення</b> протягом 14 днів</p></div></div></div>
<div class="tabs" id="dt"><button data-tab="desc" class="${detail.tab==='desc'?'on':''}">Опис</button><button data-tab="spec" class="${detail.tab==='spec'?'on':''}">Характеристики</button><button data-tab="rev" class="${detail.tab==='rev'?'on':''}">Відгуки (${p.reviews})</button></div>
<div id="tabbody">${detail.tab==='desc'?`<p style="padding:20px 0;max-width:800px">${esc(p.desc)}</p>`:detail.tab==='spec'?`<table class="spec"><tr><td>Бренд</td><td>${esc(p.brand)}</td></tr><tr><td>Категорія</td><td>${CATS[p.cat]}</td></tr>${p.specs.map(s=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</table>`:`<div style="padding:10px 0 20px;max-width:800px">${[['Андрій М.','Дуже задоволений: якість відмінна, доставили за день.'],['Ірина Г.','Користуюсь другий сезон, жодних нарікань. Рекомендую.']].map(r=>`<div class="rev"><b>${r[0]}</b> <span class="stars">★★★★★</span><p>${r[1]}</p></div>`).join('')}</div>`}</div>
${rel.length?`<section style="padding:20px 0 56px"><h2>Схожі товари</h2><div class="grid">${rel.map(card).join('')}</div></section>`:''}`;updateBadges();window.scrollTo({top:0})}
const rd=p=>{const y=scrollY;showDetail(p.id);scrollTo(0,y)};
V.addEventListener('click',e=>{const t=e.target,p=byId(detail.id);if(!p||!location.hash.startsWith('#p='))return;
if(t.dataset.opt){detail.opt=t.dataset.opt;return rd(p)}if(t.dataset.img){detail.img=+t.dataset.img;return rd(p)}
if(t.dataset.q){detail.qty=Math.max(1,Math.min(p.stock||1,detail.qty+(+t.dataset.q)));return rd(p)}if(t.dataset.tab){detail.tab=t.dataset.tab;return rd(p)}
if(t.id==='addc'){addToCart(p.id,detail.opt,detail.qty);toast('✓ Товар додано в кошик')}if(t.id==='buy'){addToCart(p.id,detail.opt,detail.qty);location.href='checkout.html'}});
function route(){const m=location.hash.match(/^#p=(\d+)/);m?showDetail(+m[1]):showList()}
window.addEventListener('hashchange',route);function onFavChange(){}
route();
</script></body></html>
