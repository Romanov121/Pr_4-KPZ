P.innerHTML=os.length?os.map(o=>`<details class="ord"><summary><b>${o.id}</b><span>${fmtDate(o.date)}</span><span style="color:var(--mut)">${o.items.length} поз.</span><span class="st ${statusCls(o.status)}">${o.status}</span><b>${fmt(o.total)}</b></summary><div class="bd">${o.items.map(i=>{const p=byId(i.id);return p?`<div class="li">${ICONS[p.icon]}<span>${esc(p.name)} <small style="color:var(--mut)">${esc(i.opt||'')} × ${i.qty}</small></span><b>${fmt(p.price*i.qty)}</b></div>`:''}).join('')}<div class="row"><span>Доставка</span><span>${esc(o.delivery)}</span></div><div class="row"><span>Оплата</span><span>${esc(o.pay)}</span></div><button class="btn sm" data-rep="${o.id}" style="margin-top:8px">Повторити замовлення</button></div></details>`).join(''):`<div class="empty"><div class="big">0</div><h2 style="margin-top:10px">Замовлень ще немає</h2><a class="btn" href="catalog.html">До каталогу</a></div>`}
else if(t==='favorites'){const f=getFavs().map(byId).filter(p=>p&&p.visible!==false);P.innerHTML=f.length?`<div class="grid">${f.map(card).join('')}</div>`:`<div class="empty"><div class="big">♡</div><h2 style="margin-top:10px">В обраному поки порожньо</h2><p>Натисніть на серце біля товару, щоб зберегти його.</p><a class="btn" href="catalog.html">До каталогу</a></div>`;updateBadges()}
else P.innerHTML=`<form class="box" id="pf" novalidate style="max-width:640px"><h3>Особисті дані</h3><div class="fld"><label for="pn">Ім'я та прізвище</label><input id="pn" data-v="name" value="${esc(u.name)}"></div><div class="fld"><label for="pe">E-mail</label><input id="pe" data-v="email" value="${esc(u.email)}"></div><div class="fld"><label for="pt">Телефон</label><input id="pt" data-v="phone" value="${esc(u.phone||'')}"></div><button class="btn">Зберегти зміни</button></form>`;
if(t==='profile'){bindValidation($('#pf'));$('#pf').onsubmit=e=>{e.preventDefault();if(!validateAll(e.target)){toast('Перевірте виділені поля',1);return}store.set('user',{...u,name:$('#pn').value.trim(),email:$('#pe').value.trim(),phone:$('#pt').value.trim()});toast('✓ Зміни збережено')}}}
function onFavChange(){if(getUser()&&tab()==='favorites')mainView()}
V.addEventListener('click',e=>{const t=e.target;if(t.dataset.t){location.hash=t.dataset.t;return}if(t.id==='out'){store.set('user',null);toast('Ви вийшли з акаунта');return authView()}
if(t.dataset.rep){const o=store.get('orders',[]).find(x=>x.id===t.dataset.rep);o.items.forEach(i=>addToCart(i.id,i.opt,i.qty));toast('✓ Товари додано в кошик');setTimeout(()=>location.href='checkout.html',700)}});
window.addEventListener('hashchange',()=>{if(getUser())mainView()});mainView();
</script></body></html>
