function dash(){const os=store.get('orders',[]),ps=getProducts();const rev=os.filter(o=>o.status!=='Скасовано').reduce((a,o)=>a+o.total,0),avg=os.length?rev/Math.max(1,os.filter(o=>o.status!=='Скасовано').length):0,low=ps.filter(p=>p.stock<5);
const days=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'],vals=[60,85,70,110,125,95,80+os.length];const max=Math.max(...vals);
const cat={};ps.forEach(p=>cat[p.cat]=(cat[p.cat]||0)+p.price*p.reviews);const tot=Object.values(cat).reduce((a,b)=>a+b,0);
V.innerHTML=`<h1>Панель керування</h1><div class="kpis"><div class="kpi"><small>Дохід (без скасованих)</small><b>${fmt(rev)}</b><span class="up">▲ 12% до минулого тижня</span></div><div class="kpi"><small>Замовлень</small><b>${os.length}</b><span class="up">нових: ${os.filter(o=>o.status==='Нове').length}</span></div><div class="kpi"><small>Середній чек</small><b>${fmt(avg)}</b><span class="dn">▼ 3%</span></div><div class="kpi"><small>Товарів закінчується</small><b>${low.length}</b><span class="dn">залишок менше 5 шт.</span></div></div>
<div class="pn"><div class="row2"><div><h3>Продажі за тиждень, тис. ₴</h3><svg viewBox="0 0 420 190" style="width:100%;max-height:280px" role="img" aria-label="Діаграма продажів">${vals.map((v,i)=>{const h=v/max*115;return `<rect x="${20+i*58}" y="${150-h}" width="34" height="${h}" rx="6" fill="#1CA9C9"/><text x="${37+i*58}" y="${144-h}" font-size="11" text-anchor="middle" fill="#1B2733">${v}</text><text x="${37+i*58}" y="172" font-size="12" text-anchor="middle" fill="#5d6f7d">${days[i]}</text>`}).join('')}</svg></div><div><h3>Частка категорій</h3>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="row"><span>${CATS[k]}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div></div>
<div class="row2"><div class="pn"><h3>Останні замовлення</h3><div class="tblw"><table class="tbl"><tr><th>№</th><th>Клієнт</th><th>Сума</th><th>Статус</th></tr>${os.slice(0,5).map(o=>`<tr><td>${o.id}</td><td>${esc(o.name)}</td><td>${fmt(o.total)}</td><td><span class="st ${statusCls(o.status)}">${o.status}</span></td></tr>`).join('')}</table></div></div>
<div class="pn"><h3>Потрібне поповнення</h3>${low.length?low.map(p=>`<div class="row"><span>${esc(p.name.slice(0,34))}</span><b class="dn">${p.stock} шт.</b></div>`).join(''):'<p>Усі товари в наявності ✓</p>'}</div></div>`}
function products(){const ps=getProducts().filter(p=>(!pf.cat||p.cat===pf.cat)&&(!pf.q||(p.name+p.sku+p.brand).toLowerCase().includes(pf.q.toLowerCase())));
V.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1>Товари</h1><a class="btn sm" href="#product-new">+ Додати товар</a></div><div class="pn"><div class="tools"><input id="aq" placeholder="Пошук за назвою або артикулом" value="${esc(pf.q)}" aria-label="Пошук"><select id="ac" aria-label="Категорія"><option value="">Усі категорії</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${pf.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="tblw"><table class="tbl"><tr><th>Товар</th><th>Артикул</th><th>Категорія</th><th>Ціна</th><th>Залишок</th><th>На сайті</th><th></th></tr>${ps.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:12px"><div class="thumb">${ICONS[p.icon]}</div><b>${esc(p.name)}</b></div></td><td>${esc(p.sku)}</td><td>${CATS[p.cat]}</td><td>${fmt(p.price)}</td><td style="${p.stock<5?'color:var(--err);font-weight:700':''}">${p.stock}</td><td><button class="sw ${p.visible!==false?'on':''}" data-vis="${p.id}" role="switch" aria-checked="${p.visible!==false}" aria-label="Показувати на сайті"></button></td><td style="white-space:nowrap"><a class="lnk" href="#product-${p.id}">Редагувати</a> · <button class="lnk d" data-del="${p.id}">Видалити</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--mut)">Нічого не знайдено</td></tr>'}</table></div></div>`;
const q=$('#aq');q.oninput=()=>{pf.q=q.value;const pos=q.selectionStart;products();const n=$('#aq');n.focus();n.setSelectionRange(pos,pos)};$('#ac').onchange=e=>{pf.cat=e.target.value;products()}}
function form(id){const isNew=id==='new';const p=isNew?{id:0,name:'',sku:'',brand:'',cat:'reg',price:'',old:'',stock:'',desc:'',visible:true,icon:'reg',rating:0,reviews:0,badge:'',specs:[]}:getProducts().find(x=>x.id==id);
if(!p){V.innerHTML='<div class="empty"><h2>Товар не знайдено</h2><a class="btn" href="#products">До списку</a></div>';return}
V.innerHTML=`<h1>${isNew?'Новий товар':'Редагування товару'}</h1><form class="pn" id="pform" novalidate><div class="fg"><div class="fld"><label for="f1">Назва товару *</label><input id="f1" data-v="req" value="${esc(p.name)}"></div><div class="fld"><label for="f2">Артикул *</label><input id="f2" data-v="req" value="${esc(p.sku)}"></div>
<div class="fld"><label for="f3">Бренд *</label><input id="f3" data-v="req" list="bl" value="${esc(p.brand)}"><datalist id="bl">${[...new Set(getProducts().map(x=>x.brand))].map(b=>`<option value="${esc(b)}">`).join('')}</datalist></div><div class="fld"><label for="f4">Категорія *</label><select id="f4">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="fld"><label for="f5">Ціна, ₴ *</label><input id="f5" type="number" min="1" data-v="price" value="${p.price}"></div><div class="fld"><label for="f6">Стара ціна, ₴ (необов'язково)</label><input id="f6" type="number" min="0" data-v="old" value="${p.old||''}"></div><div class="fld"><label for="f7">Залишок, шт. *</label><input id="f7" type="number" min="0" data-v="stock" value="${p.stock}"></div></div>
<div class="fld"><label for="f8">Опис</label><textarea id="f8">${esc(p.desc)}</textarea></div><label class="drop" for="f9" id="drop">Перетягніть фото сюди або натисніть, щоб обрати · JPG, PNG, WebP до 5 МБ<input id="f9" type="file" accept="image/*" multiple hidden></label>
<label class="chk" style="margin-bottom:22px"><input type="checkbox" id="f10" ${p.visible!==false?'checked':''}><b>Показувати на сайті</b></label><div style="display:flex;gap:14px;flex-wrap:wrap"><button class="btn">Зберегти</button><a class="btn sec" href="#products">Скасувати</a></div></form>`;
Object.assign(RULES,{price:[v=>+v>0,'Вкажіть ціну більше 0'],stock:[v=>v!==''&&+v>=0&&Number.isInteger(+v),'Ціле число, не менше 0'],old:[v=>v===''||+v>+$('#f5').value,'Має бути більшою за поточну ціну']});
const f=$('#pform');bindValidation(f);$('#f9').onchange=e=>{$('#drop').firstChild.textContent=e.target.files.length?'Обрано файлів: '+e.target.files.length+' ('+[...e.target.files].map(x=>x.name).join(', ')+')':'Перетягніть фото сюди або натисніть, щоб обрати'};
f.onsubmit=e=>{e.preventDefault();if(!validateAll(f)){toast('Перевірте виділені поля',1);return}const ps=getProducts();const d={name:$('#f1').value.trim(),sku:$('#f2').value.trim(),brand:$('#f3').value.trim(),cat:$('#f4').value,price:+$('#f5').value,old:+$('#f6').value||0,stock:+$('#f7').value,desc:$('#f8').value.trim(),visible:$('#f10').checked};
if(isNew){const nid=Math.max(0,...ps.map(x=>x.id))+1;ps.push({...p,...d,id:nid,icon:{mask:'mask',suit:'suit',reg:'reg',bcd:'bcd',tank:'tank',comp:'comp',light:'light',bag:'bag'}[d.cat],rating:0,reviews:0,badge:'Новинка',specs:(SPECS[d.cat]||[]).map(x=>x.slice())})}else Object.assign(ps.find(x=>x.id==p.id),d);
store.set('products',ps);toast('✓ Товар збережено');location.hash='#products'}}
function orders(){const os=store.get('orders',[]);const list=of==='Усі'?os:os.filter(o=>o.status===of);
V.innerHTML=`<h1>Замовлення</h1><div class="pn"><div class="pills">${['Усі',...STATUSES.map(s=>s[0])].map(s=>`<button data-f="${s}" class="${of===s?'on':''}">${s} (${s==='Усі'?os.length:os.filter(o=>o.status===s).length})</button>`).join('')}</div><div class="tblw"><table class="tbl ords"><tr><th>№</th><th>Клієнт</th><th>Дата</th><th>Сума</th><th>Статус</th><th></th></tr>${list.map(o=>`<tr><td><b>${o.id}</b></td><td>${esc(o.name)}<br><small style="color:var(--mut)">${esc(o.phone||'')}</small></td><td>${fmtDate(o.date)}</td><td>${fmt(o.total)}</td><td><select data-st="${o.id}" aria-label="Статус">${STATUSES.map(s=>`<option ${s[0]===o.status?'selected':''}>${s[0]}</option>`).join('')}</select></td><td><button class="lnk" data-open="${o.id}">Відкрити</button></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--mut)">Замовлень немає</td></tr>'}</table></div></div>`}
V.addEventListener('click',e=>{const t=e.target;const v=t.closest('[data-vis]');if(v){const ps=getProducts();const p=ps.find(x=>x.id==v.dataset.vis);p.visible=p.visible===false;store.set('products',ps);toast(p.visible?'Товар опубліковано':'Товар приховано');return products()}
const d=t.closest('[data-del]');if(d){const p=byId(d.dataset.del);if(confirm('Видалити товар «'+p.name+'»?')){store.set('products',getProducts().filter(x=>x.id!=p.id));toast('Товар видалено');products()}return}
if(t.dataset.f){of=t.dataset.f;return orders()}
if(t.dataset.open){const o=store.get('orders',[]).find(x=>x.id===t.dataset.open);openModal(`<h2 style="margin-bottom:6px">Замовлення ${o.id}</h2><p style="color:var(--mut);margin-bottom:14px">${fmtDate(o.date)} · <span class="st ${statusCls(o.status)}">${o.status}</span></p>${o.items.map(i=>{const p=byId(i.id);return p?`<div class="row"><span>${esc(p.name)} <small style="color:var(--mut)">${esc(i.opt||'')} × ${i.qty}</small></span><b>${fmt(p.price*i.qty)}</b></div>`:''}).join('')}<div class="row"><span>Клієнт</span><span>${esc(o.name)}, ${esc(o.phone||'')}</span></div><div class="row"><span>Доставка</span><span>${esc(o.delivery)}</span></div><div class="row"><span>Оплата</span><span>${esc(o.pay)}</span></div><div class="row t"><span>Разом</span><span>${fmt(o.total)}</span></div>`)}
const g=t.closest('[data-go]');if(g){location.hash='#'+g.dataset.go}});
V.addEventListener('change',e=>{if(e.target.dataset.st){const os=store.get('orders',[]);os.find(o=>o.id===e.target.dataset.st).status=e.target.value;store.set('orders',os);toast('✓ Статус оновлено');orders()}});
$('#anav').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)location.hash='#'+g.dataset.go});
window.addEventListener('hashchange',render);render();
</script></body></html>
