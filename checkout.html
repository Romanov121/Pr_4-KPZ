<div class="box" style="text-align:left"><div class="row"><span>Доставка</span><b>${esc(done.delivery)}</b></div><div class="row"><span>Оплата</span><b>${esc(done.pay)}</b></div><div class="row"><span>Одержувач</span><b>${esc(done.name)}</b></div><div class="row t"><span>Сума</span><span>${fmt(done.total)}</span></div></div>
<div class="tl"><div class="d"><i></i>Прийнято</div><div><i></i>Збирається</div><div><i></i>Відправлено</div><div><i></i>Доставлено</div></div>
<div style="display:flex;gap:16px;justify-content:center;margin-top:30px;flex-wrap:wrap"><a class="btn" href="account.html#orders">Мої замовлення</a><a class="btn sec" href="catalog.html">Продовжити покупки</a></div></div>`;return}
if(!c.ls.length){V.innerHTML=`<div class="crumbs"><a href="index.html">Головна</a> › Кошик</div><div class="empty"><div class="big">0</div><h1 style="margin:10px 0 8px">Кошик порожній</h1><p>Додайте товари з каталогу, щоб оформити замовлення.</p><a class="btn" href="catalog.html">До каталогу</a></div>`;return}
if(step===1){V.innerHTML=`<div class="crumbs"><a href="index.html">Головна</a> › Кошик</div><h1>Кошик <span style="color:#8a97a3;font-size:22px">(${c.ls.reduce((a,l)=>a+l.qty,0)})</span></h1>${stepper()}
<div class="co"><div>${c.ls.map((l,i)=>`<div class="cartrow"><div class="th">${ICONS[l.p.icon]}</div><div><b><a href="catalog.html#p=${l.p.id}" style="color:var(--text)">${esc(l.p.name)}</a></b><small>${esc(l.opt)}</small><div style="color:${l.p.stock?'var(--ok)':'var(--err)'};font-size:13px">${l.p.stock?'✓ В наявності':'Немає в наявності'}</div></div>
<div class="qty"><button data-q="${i}" data-d="-1" aria-label="Менше">−</button><span>${l.qty}</span><button data-q="${i}" data-d="1" aria-label="Більше">+</button></div><div class="p">${fmt(l.p.price*l.qty)}</div><button class="x" data-rm="${i}" aria-label="Видалити">✕</button></div>`).join('')}
<form class="prom" id="pf"><input id="pc" placeholder="Промокод (спробуйте SEA10)" value="${esc(promo)}" aria-label="Промокод"><button class="btn sec sm">Застосувати</button></form><p style="margin-top:22px"><a href="catalog.html">← Продовжити покупки</a></p></div>
${summary(c,'<button class="btn block" id="next" style="margin-top:18px">Оформити замовлення</button><small style="display:block;margin-top:12px;color:var(--mut);font-size:12px;text-align:center">Без реєстрації: можна оформити як гість</small>')}</div>`;return}
const u=getUser();if(u&&!form.name)form={...form,name:u.name||'',email:u.email||'',phone:u.phone||''};
V.innerHTML=`<div class="crumbs"><a href="index.html">Головна</a> › <a href="#" id="back">Кошик</a> › Оформлення</div><h1>Оформлення замовлення</h1>${stepper()}
<form class="co" id="of" novalidate><div><div class="box"><h3>1. Контактні дані</h3><div class="f2"><div class="fld"><label for="n">Ім'я та прізвище</label><input id="n" data-v="name" autocomplete="name" value="${esc(form.name)}"></div><div class="fld"><label for="ph">Телефон</label><input id="ph" data-v="phone" type="tel" autocomplete="tel" placeholder="+380 67 123 45 67" value="${esc(form.phone)}"></div></div><div class="fld"><label for="em">E-mail</label><input id="em" data-v="email" type="email" autocomplete="email" value="${esc(form.email)}"></div>${u?'':'<p style="font-size:13px;color:var(--mut)">Уже є акаунт? <a href="account.html">Увійти</a>, щоб підставити дані автоматично.</p>'}</div>
<div class="box"><h3>2. Доставка</h3>${Object.entries(DELIV).map(([k,d])=>`<label class="opt"><input type="radio" name="dl" value="${k}" ${form.deliv===k?'checked':''}><div><b>${d[0]}</b><small>${d[1]}</small></div><span>${k==='pick'?'Безкоштовно':c.free?'Безкоштовно':k==='cr'?'110 ₴':'100 ₴'}</span></label>`).join('')}
<div class="fld" id="addrf" ${form.deliv==='pick'?'hidden':''}><label for="ad">${form.deliv==='cr'?'Адреса доставки':'Місто та відділення'}</label><input id="ad" data-v="req" value="${esc(form.addr)}" placeholder="${form.deliv==='cr'?'Київ, вул. Хрещатик, 1, кв. 5':'Київ, відділення №12'}"></div></div>
<div class="box"><h3>3. Оплата</h3><label class="opt"><input type="radio" name="pay" value="card" ${form.pay==='card'?'checked':''}><div><b>Картка онлайн</b><small>Visa, Mastercard, Apple Pay, Google Pay</small></div></label><label class="opt"><input type="radio" name="pay" value="cod" ${form.pay==='cod'?'checked':''}><div><b>Оплата при отриманні</b><small>Готівкою або карткою на пошті</small></div></label>
<div class="fld"><label for="nt">Коментар до замовлення (необов'язково)</label><textarea id="nt" style="min-height:70px">${esc(form.note)}</textarea></div></div></div>
${summary(c,'<button class="btn block" style="margin-top:18px">Підтвердити замовлення</button><small style="display:block;margin-top:12px;color:var(--mut);font-size:12px;text-align:center">🔒 Підтвердження прийде на e-mail</small>')}</form>`;
bindValidation($('#of'))}
V.addEventListener('click',e=>{const t=e.target;const q=t.closest('[data-q]');if(q){const c=getCart(),l=c[q.dataset.q],p=byId(l.id);l.qty=Math.max(1,Math.min(p.stock||1,l.qty+(+q.dataset.d)));store.set('cart',c);updateBadges();return render()}
const r=t.closest('[data-rm]');if(r){const c=getCart();c.splice(+r.dataset.rm,1);store.set('cart',c);updateBadges();toast('Товар видалено');return render()}
if(t.id==='next'){if(lines().some(l=>!l.p.stock)){toast('Видаліть товари, яких немає в наявності',1);return}step=2;return render()}if(t.id==='back'){e.preventDefault();step=1;render()}});
V.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='pf'){const v=$('#pc').value.trim().toUpperCase();if(v&&v!=='SEA10'){toast('Промокод не знайдено',1);return}promo=v;store.set('promo',v);toast(v?'✓ Промокод застосовано: −10%':'Промокод прибрано');return render()}
if(e.target.id==='of'){syncForm();if(!validateAll(e.target)){toast('Перевірте виділені поля',1);return}const c=calc();const o={id:'DB-'+(20500+Math.floor(Math.random()*400)),date:new Date().toISOString().slice(0,10),items:c.ls.map(l=>({id:l.id,opt:l.opt,qty:l.qty})),total:c.total,status:'Нове',name:form.name,phone:form.phone,email:form.email,delivery:DELIV[form.deliv][0],pay:form.pay==='card'?'Картка онлайн':'При отриманні'};
const os=store.get('orders',[]);os.unshift(o);store.set('orders',os);const pr=getProducts();c.ls.forEach(l=>{const p=pr.find(x=>x.id===l.id);p.stock=Math.max(0,p.stock-l.qty)});store.set('products',pr);store.set('cart',[]);store.set('promo','');promo='';updateBadges();done=o;step=3;render()}});
function syncForm(){const g=id=>($(id)||{}).value;form={name:g('#n'),phone:g('#ph'),email:g('#em'),deliv:($('[name=dl]:checked')||{}).value||'np',pay:($('[name=pay]:checked')||{}).value||'card',addr:g('#ad')||'',note:g('#nt')||''};store.set('form',form)}
V.addEventListener('change',e=>{if(e.target.name==='dl'||e.target.name==='pay'){syncForm();const y=scrollY;render();scrollTo(0,y)}});
render();
</script></body></html>
